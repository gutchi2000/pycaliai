<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#182c4a"/>
      <stop offset="60%" stop-color="#101e36"/>
      <stop offset="100%" stop-color="#080f1d"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ee6d8"/>
      <stop offset="100%" stop-color="#3b8df5"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGold" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- faint track ring -->
  <circle cx="512" cy="512" r="452" fill="none" stroke="#ffd75e" stroke-width="5"
          stroke-dasharray="4 86" stroke-linecap="round" opacity="0.35"/>

  <!-- background stars -->
  <g fill="#7fd9ff" opacity="0.35">
    <circle cx="190" cy="270" r="4"/>
    <circle cx="260" cy="170" r="3"/>
    <circle cx="820" cy="230" r="4"/>
    <circle cx="880" cy="430" r="3"/>
    <circle cx="170" cy="560" r="3"/>
    <circle cx="840" cy="700" r="4"/>
    <circle cx="700" cy="850" r="3"/>
    <circle cx="250" cy="880" r="3"/>
  </g>

  <!-- horse head: low-poly constellation -->
  <g filter="url(#glow)">
    <!-- faint fill -->
    <polygon points="308,830 352,592 412,416 462,296 520,252 588,168 608,262 656,330 700,430 752,500 758,556 700,584 636,576 580,634 516,706 470,830"
             fill="#3ee6d8" opacity="0.07"/>
    <!-- outline -->
    <polygon points="308,830 352,592 412,416 462,296 520,252 588,168 608,262 656,330 700,430 752,500 758,556 700,584 636,576 580,634 516,706 470,830"
             fill="none" stroke="url(#line)" stroke-width="13" stroke-linejoin="round"/>
    <!-- interior constellation lines -->
    <g stroke="url(#line)" stroke-width="7" opacity="0.8">
      <line x1="462" y1="296" x2="594" y2="398"/>
      <line x1="656" y1="330" x2="594" y2="398"/>
      <line x1="700" y1="430" x2="594" y2="398"/>
      <line x1="412" y1="416" x2="594" y2="398"/>
      <line x1="412" y1="416" x2="580" y2="634"/>
      <line x1="580" y1="634" x2="594" y2="398"/>
      <line x1="636" y1="576" x2="700" y2="430"/>
      <line x1="516" y1="706" x2="352" y2="592"/>
      <line x1="412" y1="416" x2="516" y2="706"/>
    </g>
    <!-- nodes -->
    <g fill="#aef6ee">
      <circle cx="308" cy="830" r="9"/>
      <circle cx="352" cy="592" r="9"/>
      <circle cx="412" cy="416" r="10"/>
      <circle cx="462" cy="296" r="9"/>
      <circle cx="520" cy="252" r="8"/>
      <circle cx="588" cy="168" r="9"/>
      <circle cx="608" cy="262" r="8"/>
      <circle cx="656" cy="330" r="9"/>
      <circle cx="700" cy="430" r="9"/>
      <circle cx="752" cy="500" r="9"/>
      <circle cx="758" cy="556" r="8"/>
      <circle cx="700" cy="584" r="8"/>
      <circle cx="636" cy="576" r="8"/>
      <circle cx="580" cy="634" r="9"/>
      <circle cx="516" cy="706" r="9"/>
      <circle cx="470" cy="830" r="9"/>
    </g>
  </g>

  <!-- gold ◎ as the eye -->
  <g filter="url(#glowGold)" stroke="#ffd75e" fill="none">
    <circle cx="594" cy="398" r="52" stroke-width="14"/>
    <circle cx="594" cy="398" r="23" stroke-width="11"/>
  </g>
</svg>
