<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyCaLiAI — AI競馬予想</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏇</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260707f">
<style>
/* 馬場バイアス — 本編のカード言語に統一 */
.baba-bias{margin:12px auto 0;max-width:var(--maxw);padding:0 var(--pad)}
.baba-bias h3{font-size:15px;font-weight:700;color:var(--tx2);letter-spacing:.1em;margin:4px 2px 10px;display:flex;align-items:center;gap:9px}
.baba-bias h3::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.baba-bias h3 .sub{font-size:12px;color:var(--tx3);font-weight:400;letter-spacing:0}
.baba-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.baba-card{border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;background:linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,0) 34%),var(--bg2);box-shadow:var(--shadow-card)}
.baba-card .bv{font-weight:700;font-size:13.5px;color:var(--tx)}
.baba-card .bc{font-size:12.5px;color:var(--tx3);margin:3px 0 7px}
.baba-card .bl{font-size:12px;line-height:1.55;padding:4px 8px;border-radius:6px;margin-top:4px;color:var(--tx2)}
.baba-card .bl.shiba{background:rgba(46,160,67,.13)}
.baba-card .bl.dirt{background:rgba(180,120,60,.15)}
</style>
</head>
<body>
<div class="bg-vignette" aria-hidden="true"></div>
<div class="track-stripe"></div>

<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <span class="brand-mark">Py<b>CaLi</b>AI</span>
      <span class="brand-ver">v6 marks</span>
    </div>
    <nav class="modenav" id="modeNav">
      <button data-mode="races" class="on">🏇 予想</button>
      <button data-mode="results">📊 成績</button>
      <a href="explain.html" style="text-decoration:none"><button type="button">🔬 分析カード</button></a>
    </nav>
    <div class="topbar-right">
      <label class="date-wrap" id="dateWrap">
        <span class="date-ico">開催日</span>
        <select id="dateSel"></select>
      </label>
    </div>
  </div>
</header>

<nav class="venues" id="venueTabs" aria-label="開催場"></nav>
<section class="baba-bias" id="babaBias" hidden></section>
<nav class="races" id="raceStrip" aria-label="レース選択"></nav>

<main id="main">
  <section id="raceHeader"></section>
  <nav class="viewtabs" id="viewTabs"></nav>
  <section id="viewbody"></section>
  <footer class="foot">
    <span id="footInfo">PyCaLiAI — 静的ビルド</span>
    <span>AI予測は参考情報です。馬券の購入判断はご自身で。</span>
  </footer>
</main>

<main id="resultsMain" hidden></main>

<div id="overlay"></div>
<aside id="drawer" aria-label="馬詳細"></aside>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="js/baba.js?v=20260707f"></script>
<script src="js/app.js?v=20260707f"></script>
</body>
</html>
