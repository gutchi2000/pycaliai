<script>
/* 用語データ: [id, 用語, 別名/英語, 説明(HTML可)] */
var GLOSSARY = [
  { id: "marks", name: "印と順位", lead: "AI がレースの中で各馬をどう並べたか。", terms: [
    ["mark", "印", "◎〇▲△△", "AI の勝率が高い順に、上位 5 頭へ付ける記号。◎ 本命、〇 対抗、▲ 単穴、△ 連下（4 位と 5 位）。印は順番だけを表し、確率の大きさは含みません。"],
    ["honmei", "本命（◎）", "AI 1 位", "AI の勝率がいちばん高い馬。サイトの成績はおもに ◎ で採点しています。"],
    ["ai-index", "AI 指数", "0–100", "モデルが出したスコアを、そのレースの最下位 0・最上位 100 に並べ直した値。レース内の相対値なので、別のレースどうしでは比べられません。"],
    ["ai-rank", "AI 順", "", "AI の勝率で並べた順位。印が付かない 6 位以下の馬にも付きます。"],
    ["speed-index", "スピード指数（速度）", "100 基準", "走破タイムを、コースごとの基準タイムと比べて、斤量・その日の馬場・ペース・競馬場の癖を差し引いた能力指数。100 が古馬 1〜2 勝クラスの標準で、1600m で 0.1 秒が 1 点。走った後の「実走指数」と、出走表に出す「予測指数」（今回の斤量込み・オッズ不使用）があります。<a class='see' href='speed.html'>作り方と成績 →</a>"],
    ["speed-real", "実走指数", "", "実際に走ったタイムから出したスピード指数。馬の詳細の「近走のスピード指数」に出します。不利や出遅れは補正していません。"],
    ["pw", "強さスコア（PW）", "power rating", "全レースの着順だけから、勝った・負けた相手の強さを積み上げて計算するレーティング（Elo 型）。芝とダートは別々で、それぞれ現役最上位の馬を 100 にしています。芝の数字とダートの数字は比べられません。結果のある日は「そのレース前」の値を出します。"],
    ["est-ninki", "推定人気・推定オッズ", "", "当日のオッズを一切使わず、過去走の成績・過去走の人気・騎手の成績などから「この馬は何番人気になりそうか」を予測した値。実際のオッズではありません。2024〜25 年の検証で、人気順の一致（順位相関）0.86、1 番人気を当てた率 66%。"],
    ["suimyo", "推妙（推定妙味）", "", "AI の勝率 × 推定オッズ ÷ 0.8 × 100。100 なら AI と推定の市場が同じ見立て、大きいほど AI の方が高く見ている。人気薄の馬ほど大きく出ます。2026 年の検証では、どの帯でも単勝の回収率は 100% を超えていないので、「この帯なら買い」という意味はありません。<a class='see' href='speed.html#suimyo'>検証 →</a>"],
    ["tenkai", "展開予想", "ペース予想・隊列", "各馬が序盤（最初のコーナー）と 4 コーナーでどのあたりにいそうかを、過去走の通過順・前半の速さ・枠・頭数・距離から予測したもの。オッズは使いません。レースの「展開」タブに隊列図で出します。2024〜25 年の答え合わせで、予想 1 番手が実際に先頭だったのは約 3 割、3 番手以内だったのは約 7 割（前 5 走の平均位置で選ぶと 26%・60%）。"],
    ["pace", "ペース予想（スロー／平均／ハイ）", "", "前半と上がりの速さの差を同じコースの標準と比べ、過去のレースを 3 等分したときに、今回がどこに入りそうかの確率。逃げ・先行しそうな馬の数と前半の速さから出します。でたらめなら 33% の 3 択で、2024〜25 年の的中は 45% 前後。"],
    ["board-agree", "一致（デイリーボード）", "", "速度 1 位・強さスコア PW 1 位・推定 1 番人気のうち、AI の◎と同じ馬だった数（0〜3）。作り方の違う物差しがそろうほど◎はよく来ていて、2026 年は 0/3 で◎の 3着内率 37%、3/3 で 75% でした。回収率は見ていません。<a class='see' href='board.html'>デイリーボード →</a>"],
    ["speed-pred", "予測指数", "", "過去の実走指数・間隔・距離や芝ダの替わり・年齢などから、今回の実走指数を予測した値（今回の斤量込み）。出走表の「速度」列。レース内の順位を # で添えます。"]
  ]},
  { id: "prob", name: "確率", lead: "AI が出す数字の中心。", terms: [
    ["p-win", "勝率", "P(1 着)", "その馬が 1 着になる確率。全馬を足すとおおよそ 100% になります。過去の実績に合うよう較正した値です。"],
    ["p-ren", "連対率", "P(2 着以内)", "2 着以内に入る確率。馬連・馬単を考えるときの目安。"],
    ["p-sho", "複勝圏（3 着内率）", "P(3 着以内)", "3 着以内に入る確率。複勝・ワイドを考えるときの目安。勝率が低くても複勝圏が高い「堅実型」の馬がいます。"],
    ["pl", "Plackett–Luce モデル", "PL", "各馬の強さのスコアから、着順全体の確率を計算する方法。「残っている馬の中から 1 頭ずつ順に選ばれる」と考えて、1 着・2 着・3 着の確率を出します。"],
    ["calib", "較正", "キャリブレーション", "AI が「20%」と言った馬が、本当に 20% くらい勝っているように数字を直すこと。過去のレースで出した確率と実際の結果を突き合わせて補正します。"],
    ["ece", "ECE", "較正誤差", "出した確率と実際の的中率のずれの平均。小さいほど確率の数字をそのまま信じられます。"]
  ]},
  { id: "race", name: "レースの性格", lead: "レース名の横のメーターと判定。", terms: [
    ["dominance", "本命優位", "", "◎ の勝率から 〇 の勝率を引いた値。大きいほど ◎ が抜けていて、小さいと上位 2 頭が横並び。"],
    ["concentration", "上位集中", "", "◎ と 〇 の勝率の合計。高いほど上位 2 頭で決まりやすいレース。"],
    ["chaos", "混戦度", "エントロピー", "全馬の勝率がどれだけ散らばっているか（0〜1）。1 に近いほど、どの馬にもチャンスがある混戦。生の値は 0.8〜1.0 に集まるので、判定では過去のレースの中での百分位に直して使います。"],
    ["agreement", "市場一致", "順位相関", "AI の順位と人気順がどれだけ一致しているか。低いレースは、AI が人気とは違う馬を推しています。"],
    ["hardness", "堅い / 標準 / 荒れ", "", "混戦度の百分位で分けたレースの見立て。下位 30% が「堅い」、上位 30% が「荒れ」、その間が「標準」。"],
    ["member-level", "メンバーレベル", "S〜D", "出走馬の近走成績の上位 3 頭平均が、同じクラスの過去のレースの中でどのくらいかを 5 段階で表したもの。S ハイレベル、A やや強め、B 標準、C やや軽い、D 低調。"]
  ]},
  { id: "market", name: "市場との比較", lead: "AI の見立てと人気（オッズ）の差。", terms: [
    ["implied", "オッズから逆算した確率", "1 ÷ オッズ", "単勝オッズの逆数。市場がその馬に付けている勝つ見込みのおおよその値です（控除率の分だけ合計は 100% を超えます）。"],
    ["vs-market", "妙味 / 中立 / 過剰", "", "AI の勝率が、オッズから逆算した確率より 20% 以上高ければ「妙味」、20% 以上低ければ「過剰」、その間が「中立」。「AI の方が高く見ている」という意味で、儲かるという意味ではありません。"],
    ["umami", "妙味グレード", "S / A / B / C / 罠", "過去に同じ状況（AI の期待値 × 人気帯）だった馬券が実際にどれだけ戻ったかで付けた格。S は過去の回収率 85% 以上、A は 80% 以上、B は 72% 以上。勝つ見込みが低すぎる馬や単勝 50 倍超の大穴は「罠」として除きます。"],
    ["ev", "期待値", "EV", "確率 × オッズ。1 を超えると理屈の上では得な馬券ですが、AI と市場の意見が大きく食い違うときは、たいてい AI の方が間違っています。サイトの買い目は期待値の大きさでは選んでいません。"],
    ["flb", "本命–大穴バイアス", "", "人気馬は実力どおりかやや控えめに、大穴は実力より高く買われやすいという、競馬に昔から知られる傾向。大穴の馬券ほど回収率が低くなります。"]
  ]},
  { id: "horse", name: "馬の評価", lead: "出走表と馬ページの補助指標。", terms: [
    ["lv", "馬レベル（Lv）", "S〜D", "近走の着順と人気から出した、その馬の近況の目安（0〜100 を S〜D に区切ったもの）。AI の確率とは別の物差しです。"],
    ["career-index", "指数推移", "", "各走の着順と人気から出した 0〜100 の指数を、キャリア全体で並べたグラフ。上り調子か下り坂かを見るためのもの。"],
    ["style", "脚質", "逃げ・先行・差し・追込", "道中のおおまかな位置取りの傾向。想定隊列とペースの見立てに使います。"],
    ["pace", "ペース予想", "S / M / H", "出走馬の脚質の組み合わせから見た、レースの流れの見立て。逃げ馬が複数いればハイペース（H）、逃げ馬不在で先行馬が多ければスロー（S）。"],
    ["shusse", "出世予測", "", "若い馬が将来オープンや重賞に届くかを予測する読み物。馬券用ではありません。"]
  ]},
  { id: "bets", name: "買い目と見送り", lead: "サイトの買い目の決め方。", terms: [
    ["skip", "見送り", "", "当てにくい、または当たっても戻りが少ないと判断したレースで、買い目を出さないこと。混戦度が上位 3 分の 1、7 頭以下、◎ の勝率 5% 未満、◎ の単勝オッズ 1.9 倍超、障害レース、データ不備のどれかで見送ります。<a class='see' href='guide.html#skip'>詳しく →</a>"],
    ["miokuri-record", "見送りの成績", "買っていたら", "見送ったレースにも同じ方式の買い目を記録しておき、結果が出た後に「もし買っていたら」を集計したもの。見送り判断そのものの成績表です。<a class='see' href='tsushinbo.html#mio'>通信簿で見る →</a>"],
    ["t20", "T-20 / T-10", "発走 20 分前 / 10 分前", "買い目を出すタイミング。発走 20 分前に速報、10 分前に直前のオッズでもう一度判定して確定します。"],
    ["display-only", "表示専用", "", "サイトの買い目は検証と情報提供のためのもので、実際のお金では買っていません。"],
    ["frozen", "凍結版", "", "最初のレースの発走前に保存した予想の控え。採点は必ずこの凍結版で行い、あとから書き換えた予想で成績を良く見せることはしません。"],
    ["torigami", "トリガミ", "", "当たったのに、払戻が使った金額より少ないこと。点数を増やすほど起きやすくなります。"]
  ]},
  { id: "score", name: "成績の見方", lead: "通信簿などの数字を読むための統計用語。", terms: [
    ["roi", "回収率", "ROI", "払戻の合計 ÷ 買った金額の合計。100% を超えればプラス。控除率があるため、平均的に買えば 75〜80% 前後になります。"],
    ["hit-rate", "的中率", "", "買った馬券のうち当たった割合。的中率が高くても回収率が高いとは限りません。"],
    ["takeout", "控除率", "", "売上のうち払戻に回らない割合。JRA では単勝・複勝 20%、馬連・ワイド・枠連 22.5%、馬単・三連複 25%、三連単 27.5%。"],
    ["ci", "95% 信頼区間", "CI", "「本当の値はたぶんこの範囲」という幅。件数が少ないほど広くなります。区間が 100% をまたいでいる回収率は、プラスともマイナスとも言い切れません。"],
    ["wilson", "Wilson 区間", "", "的中率のような割合に付ける信頼区間の計算方法。件数が少ないときや、割合が 0% や 100% に近いときでも幅がおかしくなりにくい方法です。"],
    ["oos", "過去検証 / 前向きの実績", "", "過去検証は、学習に使っていない過去のレースで確かめた成績。前向きの実績は、発走前に公開した予想をそのまま採点した本番の成績。サイトが公表する成績は前向きの実績だけです。"],

(function(){
  var $ = function(id){ return document.getElementById(id); };
  function strip(h){ var d = document.createElement("div"); d.innerHTML = h; return d.textContent || ""; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function hl(text, q){
    var t = esc(text); if(!q) return t;
    var i = t.toLowerCase().indexOf(esc(q).toLowerCase());
    return i < 0 ? t : t.slice(0, i) + "<mark>" + t.slice(i, i + esc(q).length) + "</mark>" + t.slice(i + esc(q).length);
  }
  function render(q){
    q = (q || "").trim();
    var ql = q.toLowerCase(), html = "", chips = "", total = 0;
    GLOSSARY.forEach(function(c){
      var rows = c.terms.filter(function(t){
        return !ql || (t[1] + " " + t[2] + " " + strip(t[3])).toLowerCase().indexOf(ql) >= 0;
      });
      if(!rows.length) return;
      total += rows.length;
      chips += '<a href="#cat-' + c.id + '">' + esc(c.name) + '<small>' + rows.length + '</small></a>';
      html += '<section class="cat" id="cat-' + c.id + '"><h2>' + esc(c.name) + '</h2><p class="lead">' + esc(c.lead) + '</p><dl>' +
        rows.map(function(t){
          return '<div class="term" id="' + t[0] + '"><dt>' + hl(t[1], q) +
            (t[2] ? '<span class="alias">' + esc(t[2]) + '</span>' : '') +
            '<a class="pl" href="#' + t[0] + '" aria-label="この用語へのリンク">#</a></dt><dd>' +
            (q ? hl(strip(t[3]), q) : t[3]) + '</dd></div>';
        }).join("") + '</dl></section>';
    });
    $("cats").innerHTML = chips;
    $("list").innerHTML = total ? html : '<p class="empty">「' + esc(q) + '」に当てはまる用語はありません。</p>';
  }
  render("");
  $("q").addEventListener("input", function(e){ render(e.target.value); });
  if(location.hash){ var el = document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView(); }
})();
</script>
