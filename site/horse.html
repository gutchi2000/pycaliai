  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 14px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;}

  .rc th{color:var(--tx3);font-weight:500;font-size:.76rem;letter-spacing:.04em;position:sticky;top:0;background:var(--bg2);}
  .rc td.l,.rc th.l{text-align:left;}
  .rc a{color:var(--tx);text-decoration:none;border-bottom:1px dotted var(--line2);}

  @media(max-width:620px){.rc th,.rc td{padding:6px 5px;} .hhead .nm{font-size:1.4rem;} .chart-wrap{height:220px;}}
